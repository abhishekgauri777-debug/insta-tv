name: Build APK from zip
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p work
          unzip -q -o ./FireTVInstagram.zip -d work
          SETTINGS=$(find work -name settings.gradle.kts -not -path '*/__MACOSX/*' | head -n 1)
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: ${{ env.PROJECT_DIR }}

      - uses: actions/upload-artifact@v4
        with:
          name: InstaTV-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
